                <div class="sf-layout">
                    <div class="vrcn-panel-card status">
                        <div class="sf-status-row">
                            <div class="sf-status"><span class="sf-dot offline" id="sfDot"></span><span id="sfStatusText" data-i18n="steamvr.status.not_connected">Not connected</span></div>
                            <button class="vrcn-button" id="sfConnBtn" onclick="sfConnect()"><span class="msi" style="font-size:16px;">link</span> <span data-i18n="common.connect">Connect</span></button>
                        </div>
                    </div>
                    <div class="vrcn-panel-card">
                        <div class="vrcn-panel-card-header"><span class="msi">power_settings_new</span> <span data-i18n="steamvr.launch.title">Launch</span></div>
                        <div class="sf-toggle-row"><span data-i18n="common.start_with_vrchat_vr">Start when launching VRChat in VR</span><label class="toggle"><input type="checkbox" id="setSfAutoStartVR" onchange="sfAutoSave()"><div class="toggle-track"><div class="toggle-knob"></div></div></label></div>
                    </div>
                    <div class="vrcn-panel-card">
                        <div class="vrcn-panel-card-header"><span class="msi">rocket_launch</span> <span data-i18n="steamvr.offset.title">Current Offset</span></div>
                        <div class="sf-offset">
                            <div class="sf-offset-values">
                                <div class="sf-axis"><span class="sf-axis-label">X</span><span class="sf-axis-val" id="sfOffX">0.000</span></div>
                                <div class="sf-axis"><span class="sf-axis-label">Y</span><span class="sf-axis-val" id="sfOffY">0.000</span></div>
                                <div class="sf-axis"><span class="sf-axis-label">Z</span><span class="sf-axis-val" id="sfOffZ">0.000</span></div>
                            </div>
                        </div>
                        <div class="sf-controllers">
                            <div class="sf-ctrl" id="sfCtrlL"><span class="msi" style="font-size:14px;">back_hand</span> <span data-i18n="common.left">Left</span></div>
                            <div class="sf-ctrl" id="sfCtrlR"><span class="msi" style="font-size:14px;">front_hand</span> <span data-i18n="common.right">Right</span></div>
                        </div>
                        <div style="margin-top:10px;">
                            <button class="vrcn-button" onclick="sfReset()" style="width:100%;justify-content:center;"><span class="msi" style="font-size:16px;">restart_alt</span> <span data-i18n="steamvr.actions.reset">Reset</span></button>
                        </div>
                    </div>
                    <div class="vrcn-panel-card">
                        <div class="vrcn-panel-card-header"><span class="msi">tune</span> <span data-i18n="steamvr.settings.title">Settings</span></div>
                        <div class="sf-row"><label data-i18n="steamvr.settings.drag_multiplier">Drag Multiplier</label><input type="range" id="sfMultiplier" min="0.1" max="100" step="0.1" value="1" oninput="document.getElementById('sfMultVal').textContent=this.value+'x';sfAutoSave()"><span id="sfMultVal" style="font-size:11px;color:var(--tx2);min-width:28px;text-align:right;">1x</span></div>
                        <div class="sf-section-label" data-i18n="steamvr.settings.axis_lock">Axis Lock</div>
                        <div class="sf-toggle-row"><span data-i18n="steamvr.settings.lock_x">Lock X</span><label class="toggle"><input type="checkbox" id="sfLockX" onchange="sfAutoSave()"><div class="toggle-track"><div class="toggle-knob"></div></div></label></div>
                        <div class="sf-toggle-row"><span data-i18n="steamvr.settings.lock_y">Lock Y</span><label class="toggle"><input type="checkbox" id="sfLockY" onchange="sfAutoSave()"><div class="toggle-track"><div class="toggle-knob"></div></div></label></div>
                        <div class="sf-toggle-row"><span data-i18n="steamvr.settings.lock_z">Lock Z</span><label class="toggle"><input type="checkbox" id="sfLockZ" onchange="sfAutoSave()"><div class="toggle-track"><div class="toggle-knob"></div></div></label></div>
                    </div>

                    <!-- Controls -->
                    <div class="vrcn-panel-card">
                        <div class="vrcn-panel-card-header"><span class="msi">gamepad</span> <span data-i18n="steamvr.controls.title">Controls</span></div>

                        <div class="sf-ctrl-grid sf-ctrl-head">
                            <span></span>
                            <span data-i18n="steamvr.controls.reset_position">Reset Position</span>
                            <span data-i18n="steamvr.controls.drag_control">Drag Control</span>
                        </div>

                        <div class="sf-ctrl-grid">
                            <label data-i18n="common.left_hand">Left Hand</label>
                            <select id="sfLeftReset" class="vrcn-select" onchange="sfAutoSave()">
                                <option value="0"  data-i18n="frameshot.keybind.none">None</option>
                                <option value="2"  data-i18n="vro.keybind.button.grip">Grip</option>
                                <option value="33" data-i18n="vro.keybind.button.trigger">Trigger</option>
                                <option value="32" data-i18n="vro.keybind.button.thumbstick">Thumbstick</option>
                                <option value="7"  data-i18n="vro.keybind.button.ax">A / X</option>
                                <option value="1"  data-i18n="vro.keybind.button.by">B / Y</option>
                            </select>
                            <select id="sfLeftDrag" class="vrcn-select" onchange="sfAutoSave()">
                                <option value="0"  data-i18n="frameshot.keybind.none">None</option>
                                <option value="2"  data-i18n="vro.keybind.button.grip">Grip</option>
                                <option value="33" data-i18n="vro.keybind.button.trigger">Trigger</option>
                                <option value="32" data-i18n="vro.keybind.button.thumbstick">Thumbstick</option>
                                <option value="7"  data-i18n="vro.keybind.button.ax">A / X</option>
                                <option value="1"  data-i18n="vro.keybind.button.by">B / Y</option>
                            </select>
                        </div>

                        <div class="sf-ctrl-grid">
                            <label data-i18n="common.right_hand">Right Hand</label>
                            <select id="sfRightReset" class="vrcn-select" onchange="sfAutoSave()">
                                <option value="0"  data-i18n="frameshot.keybind.none">None</option>
                                <option value="2"  data-i18n="vro.keybind.button.grip">Grip</option>
                                <option value="33" data-i18n="vro.keybind.button.trigger">Trigger</option>
                                <option value="32" data-i18n="vro.keybind.button.thumbstick">Thumbstick</option>
                                <option value="7"  data-i18n="vro.keybind.button.ax">A / X</option>
                                <option value="1"  data-i18n="vro.keybind.button.by">B / Y</option>
                            </select>
                            <select id="sfRightDrag" class="vrcn-select" onchange="sfAutoSave()">
                                <option value="0"  data-i18n="frameshot.keybind.none">None</option>
                                <option value="2"  data-i18n="vro.keybind.button.grip">Grip</option>
                                <option value="33" data-i18n="vro.keybind.button.trigger">Trigger</option>
                                <option value="32" data-i18n="vro.keybind.button.thumbstick">Thumbstick</option>
                                <option value="7"  data-i18n="vro.keybind.button.ax">A / X</option>
                                <option value="1"  data-i18n="vro.keybind.button.by">B / Y</option>
                            </select>
                        </div>
                    </div>
                </div>
